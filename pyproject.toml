[project]
name = "oviotaskscreator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SevenTwelve712", email = "seventwwwelve712@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.1",
    "pillow>=12.3.0",
    "python-docx>=1.2.0",
]

[project.scripts]
oviotaskscreator = "oviotaskscreator:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.uv-build]
packages = [
    { include = "*", from = "src" }, # Искать пакеты внутри src/
    { include = "tests" }            # Включить папку tests из корня
]
